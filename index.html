html[data-season] body{background:radial-gradient(900px 500px at 90% -10%,var(--g1),transparent 60%),radial-gradient(700px 400px at -10% 110%,var(--g2),transparent 60%),var(--bg)}

.szn{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}

/* natal: neve + luzinhas */
.sn{inset:0;background-repeat:repeat;animation:snow linear infinite}
.sn.s1{background-image:radial-gradient(3px 3px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 90px 120px,#fff,transparent),radial-gradient(3px 3px at 160px 70px,#fffc,transparent);background-size:200px 200px;--dx:30px;--dy:600px;animation-duration:12s;opacity:.85}

/* ano novo: fogos + confete */
.fw{width:150px;height:150px;margin:-75px;border-radius:50%;opacity:0;background:repeating-conic-gradient(from 0deg,var(--c) 0 2.5deg,transparent 2.5deg 15deg);-webkit-mask:radial-gradient(circle,transparent 0 28%,#000 30% 62%,transparent 64%);mask:radial-gradient(circle,transparent 0 28%,#000 30% 62%,transparent 64%);animation:fw 5.5s ease-out infinite}

.cf{inset:0;background-repeat:repeat;animation:snow linear infinite}
.cf.c1{background-image:radial-gradient(3px 3px at 30px 40px,#FFD76A,transparent),radial-gradient(2px 2px at 130px 150px,#fff,transparent),radial-gradient(3px 3px at 220px 90px,#FF9F43,transparent),radial-gradient(2px 2px at 90px 230px,#7DF9FF,transparent);background-size:260px 260px;--dx:20px;--dy:780px;animation-duration:16s;opacity:.85}

  --cyan: oklch(0.83 0.165 212);
  --cyan-foreground: oklch(0.13 0.035 255);
  --gold: oklch(0.83 0.175 84);
  --gold-foreground: oklch(0.16 0.04 75);
  --live: oklch(0.76 0.19 152);
  --crimson: oklch(0.65 0.24 18);
  --elite: oklch(0.70 0.22 296);
  --valkyria: oklch(0.66 0.285 346);
  --mythic: oklch(0.66 0.27 304);
  --muted: oklch(0.21 0.045 258);
  --muted-foreground: oklch(0.74 0.045 246);
  --border: oklch(0.35 0.085 256 / 55%);
  --input: oklch(0.32 0.075 256 / 70%);

  /* Legacy alias tokens mapped 1:1 to preview OKLCH tokens */
  --bg: var(--background);
  --bg2: var(--sidebar);
  --cardbg: var(--card);
  --pri: var(--primary);
  --cy: var(--cyan);
  --ok: var(--live);
  --bad: var(--crimson);
  --valk: var(--valkyria);
  --myth: var(--mythic);
  --tx: var(--foreground);
  --so: var(--muted-foreground);
  --ln: var(--border);
  --font-display: 'Chakra Petch', 'Rajdhani', system-ui, sans-serif;
  --font-sans: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sb-w: 256px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body {
  background-color: var(--background) !important;
  background-image:
    radial-gradient(ellipse 68% 44% at 86% -4%, color-mix(in oklch, var(--primary) 34%, transparent), transparent 64%),
    radial-gradient(ellipse 52% 40% at 10% 106%, color-mix(in oklch, var(--cyan) 20%, transparent), transparent 62%),
    linear-gradient(to right, color-mix(in oklch, var(--cyan) 5%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in oklch, var(--cyan) 5%, transparent) 1px, transparent 1px) !important;
  background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px !important;
  background-attachment: fixed !important;
  color: var(--foreground) !important;
  font-family: var(--font-sans) !important;
  font-size: 15px !important;
  min-height: 100vh;
}
h1, h2, h3, h4, .bc-disp { font-family: var(--font-display) !important; letter-spacing: .015em; }
a { color: inherit; }

/* Inline Lucide icon helper */
.bc-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: -0.14em;
  flex: none;
  line-height: 1;
}
.bc-ico svg {
  display: block;
  width: 1em;
  height: 1em;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.bc-h-ico {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

/* Remove old mobile bottom bar completely */
#bnav, .bnav { display: none !important; }

/* ===== ANIMATIONS ===== */
@keyframes bc-float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-9px) scale(1.025); } }
@keyframes bc-beam { 0% { transform: translateX(-150%) skewX(-22deg); } 45%,100% { transform: translateX(260%) skewX(-22deg); } }
@keyframes bc-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes bc-pulse-aura { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.06); } }
.bc-view { animation: bc-enter .32s cubic-bezier(.2,.8,.2,1) both; }

/* ===== JOUNIN REACT INSPIRED SHELL ===== */
#app, .app { display: block !important; min-height: 100vh; width: 100% !important; }

#nav {
  position: fixed !important;
  inset: 0 auto 0 0 !important;
  width: var(--sb-w) !important;
  height: 100vh !important;
  z-index: 60 !important;
  display: flex !important;
  flex-direction: column !important;
  background: color-mix(in oklch, var(--sidebar) 94%, transparent) !important;
  backdrop-filter: blur(22px) !important;
  border-right: 1px solid oklch(0.35 0.085 256 / 45%) !important;
  padding: 0 !important;
  overflow: hidden !important;
  transition: width .24s ease, transform .28s cubic-bezier(.2,.8,.2,1) !important;
}
html.bc-sb-col #nav { width: 76px !important; }
html.bc-sb-col .bc-sb-txt,
html.bc-sb-col .bc-sb-grp,
html.bc-sb-col .bc-sb-badge,
html.bc-sb-col .bc-sb-disc-txt { display: none !important; }
html.bc-sb-col .bc-nav-item { justify-content: center; padding: 10px 0 !important; }
html.bc-sb-col .bc-sb-brand { justify-content: center; }

.bc-sb-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 14px 14px 12px; border-bottom: 1px solid oklch(0.35 0.085 256 / 45%);
}
.bc-sb-brand {
  display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer;
  background: none; border: 0; padding: 0; color: inherit; text-align: left;
}
.bc-sb-logo {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  background: color-mix(in oklch, var(--background) 86%, transparent);
  border: 1px solid color-mix(in oklch, var(--cyan) 42%, transparent);
  display: grid; place-items: center; padding: 4px;
  box-shadow: 0 0 18px color-mix(in oklch, var(--primary) 35%, transparent);
}
.bc-sb-logo img { width: 100%; height: 100%; object-fit: contain; }
.bc-sb-title { font: 700 18px/1 var(--font-display); letter-spacing: .04em; color: var(--foreground); }
.bc-sb-sub { font: 700 9.5px/1 var(--font-mono); letter-spacing: .2em; color: var(--cyan); margin-top: 3px; }
.bc-sb-toggle, .bc-sb-close {
  width: 32px; height: 32px; border-radius: 9px;
  border: 1px solid var(--border);
  background: color-mix(in oklch, var(--surface-elevated) 72%, transparent);
  color: var(--muted-foreground);
  cursor: pointer; display: grid; place-items: center; flex: none;
  transition: .18s;
}
.bc-sb-toggle:hover, .bc-sb-close:hover { color: var(--foreground); border-color: color-mix(in oklch, var(--cyan) 60%, transparent); }
.bc-sb-close { display: none; }

.bc-sb-scroll { flex: 1; overflow-y: auto; padding: 10px 10px 16px; scrollbar-width: thin; }
.bc-sb-grp {
  font: 700 10px/1 var(--font-mono); letter-spacing: .2em;
  color: color-mix(in oklch, var(--muted-foreground) 72%, transparent);
  padding: 12px 10px 6px; text-transform: uppercase;
}
.bc-nav-item {
  width: 100%; display: flex; align-items: center; gap: 11px;
  padding: 9px 11px; margin: 2px 0; border-radius: 12px;
  border: 1px solid transparent; background: transparent;
  color: var(--muted-foreground); font: 500 13.5px/1.2 var(--font-sans);
  text-decoration: none; cursor: pointer; position: relative;
  transition: background .18s, color .18s, transform .18s, border-color .18s;
}
.bc-nav-item:hover {
  background: color-mix(in oklch, var(--surface-elevated) 65%, transparent);
  color: var(--foreground); transform: translateX(2px);
}
.bc-nav-item.on {
  color: var(--foreground);
  background: linear-gradient(90deg, color-mix(in oklch, var(--ac, var(--primary)) 28%, transparent), color-mix(in oklch, var(--ac, var(--cyan)) 10%, transparent));
  border-color: color-mix(in oklch, var(--ac, var(--cyan)) 42%, transparent);
  box-shadow: inset 3px 0 0 var(--ac, var(--cyan)), 0 6px 20px -10px color-mix(in oklch, var(--ac, var(--cyan)) 55%, transparent);
}
.bc-nav-item > svg { width: 17px; height: 17px; flex: none; stroke-width: 2; }
.bc-nav-item.on > svg { color: var(--ac, var(--cyan)); }
.bc-sb-badge {
  margin-left: auto; font: 700 9px/1 var(--font-mono); letter-spacing: .12em;
  padding: 3px 6px; border-radius: 999px;
  border: 1px solid color-mix(in oklch, var(--ac, var(--cyan)) 55%, transparent);
  color: var(--ac, var(--cyan));
  background: color-mix(in oklch, var(--ac, var(--cyan)) 16%, transparent);
}
.bc-sb-foot { padding: 12px; border-top: 1px solid oklch(0.35 0.085 256 / 45%); }
.bc-sb-disc {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px; border-radius: 12px; border: 0; cursor: pointer;
  font: 700 11.5px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase;
  background: linear-gradient(135deg, var(--primary), oklch(0.66 0.22 232));
  color: var(--primary-foreground);
  box-shadow: 0 8px 24px -6px color-mix(in oklch, var(--primary) 72%, transparent), inset 0 1px 0 color-mix(in oklch, var(--foreground) 30%, transparent);
  transition: .18s;
}
.bc-sb-disc:hover { filter: brightness(1.08); transform: translateY(-1px); }

#bc-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: oklch(0.08 0.02 258 / 72%); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity .22s ease;
}
html.bc-mob-open #bc-backdrop { opacity: 1; pointer-events: auto; }

/* TOPBAR */
#tb {
  position: sticky !important; top: 0 !important; z-index: 40 !important;
  margin-left: var(--sb-w) !important;
  background: color-mix(in oklch, var(--background) 85%, transparent) !important;
  backdrop-filter: blur(18px) !important;
  border-bottom: 1px solid var(--border) !important;
  padding: 10px 24px !important;
  transition: margin-left .24s ease;
}
html.bc-sb-col #tb { margin-left: 76px !important; }
.bc-tb-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1320px; margin: 0 auto; }
.bc-tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bc-menu-btn {
  display: none; width: 38px; height: 38px; border-radius: 11px;
  border: 1px solid var(--border);
  background: color-mix(in oklch, var(--card) 86%, transparent);
  color: var(--foreground); cursor: pointer; align-items: center; justify-content: center; flex: none;
}
.bc-tb-mobbrand { display: none; align-items: center; gap: 8px; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
.bc-tb-mobbrand img { width: 28px; height: 28px; object-fit: contain; }
.bc-tb-mobbrand span { font: 700 15px/1 var(--font-display); letter-spacing: .04em; }
.bc-tb-crumb { display: flex; align-items: center; gap: 8px; font: 700 11.5px/1 var(--font-mono); letter-spacing: .16em; color: var(--muted-foreground); text-transform: uppercase; }
.bc-tb-crumb i { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); display: inline-block; }

.bc-tb-right { display: flex; align-items: center; gap: 8px; position: relative; }
.bc-tb-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 11px;
  border: 1px solid var(--border);
  background: color-mix(in oklch, var(--card) 82%, transparent);
  color: var(--foreground);
  font: 700 11px/1 var(--font-mono); letter-spacing: .08em; cursor: pointer; transition: .18s;
}
.bc-tb-pill:hover { border-color: color-mix(in oklch, var(--cyan) 60%, transparent); background: color-mix(in oklch, var(--surface-elevated) 85%, transparent); }
.bc-tb-pill.gold {
  border-color: color-mix(in oklch, var(--gold) 55%, transparent);
  background: color-mix(in oklch, var(--gold) 14%, transparent);
  color: var(--gold);
}

/* Round Profile Avatar on Top-Right (Jounin React) */
.bc-av-btn {
  position: relative; width: 40px; height: 40px; border-radius: 999px;
  border: 2px solid color-mix(in oklch, var(--cyan) 65%, transparent);
  background: linear-gradient(135deg, color-mix(in oklch, var(--primary) 38%, transparent), color-mix(in oklch, var(--background) 92%, transparent));
  color: var(--cyan); font: 700 13px/1 var(--font-display); cursor: pointer;
  display: grid; place-items: center; padding: 0; overflow: visible;
  box-shadow: 0 0 18px color-mix(in oklch, var(--primary) 35%, transparent);
  transition: transform .18s, border-color .18s;
}
.bc-av-btn:hover { transform: scale(1.04); border-color: var(--cyan); }
.bc-av-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 999px; }
.bc-av-dot {
  position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px;
  border-radius: 999px; border: 2px solid var(--background); background: var(--dot, var(--live));
}
.bc-pmenu {
  position: absolute; right: 0; top: calc(100% + 10px); width: 248px;
  border-radius: 16px; border: 1px solid color-mix(in oklch, var(--cyan) 42%, transparent);
  background: color-mix(in oklch, var(--sidebar) 97%, transparent);
  backdrop-filter: blur(22px);
  box-shadow: 0 22px 54px oklch(0.05 0.02 260 / 92%);
  padding: 10px; z-index: 80; display: none;
}
.bc-pmenu.open { display: block; animation: bc-enter .18s ease both; }
.bc-pmenu-hd { padding: 8px 10px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.bc-pmenu-hd b { display: block; font: 700 15px/1.2 var(--font-display); }
.bc-pmenu-hd small { display: block; font: 600 10.5px/1.3 var(--font-mono); color: var(--muted-foreground); margin-top: 2px; }
.bc-pmenu button {
  width: 100%; display: flex; align-items: center; gap: 9px; text-align: left;
  padding: 9px 10px; border-radius: 10px; border: 0; background: transparent;
  color: var(--foreground); font: 500 13px/1.2 var(--font-sans); cursor: pointer;
}
.bc-pmenu button:hover { background: color-mix(in oklch, var(--surface-elevated) 82%, transparent); color: var(--cyan); }
.bc-pmenu .bc-pm-pri {
  margin-top: 6px; justify-content: center; font: 700 11.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase;
  background: linear-gradient(135deg, var(--primary), oklch(0.66 0.22 232)); color: var(--primary-foreground);
}

/* MAIN AREA */
main {
  margin-left: var(--sb-w) !important;
  width: auto !important;
  max-width: none !important;
  padding: 20px 26px 56px !important;
  transition: margin-left .24s ease;
}
html.bc-sb-col main { margin-left: 76px !important; }
#v { max-width: 1320px; margin: 0 auto; }

/* ===== EXACT PREVIEW OKLCH BANNER & PANELS ===== */
.bc-banner {
  position: relative; overflow: hidden; border-radius: 1.5rem;
  border: 1px solid color-mix(in oklch, var(--ca, var(--cyan)) 48%, transparent);
  background:
    radial-gradient(64% 120% at 88% 50%, color-mix(in oklch, var(--ca, var(--cyan)) 26%, transparent), transparent 72%),
    radial-gradient(50% 90% at 12% 0%, color-mix(in oklch, var(--ca2, var(--primary)) 32%, transparent), transparent 68%),
    linear-gradient(125deg, oklch(0.155 0.048 260) 0%, oklch(0.115 0.034 258) 56%, oklch(0.14 0.046 254) 100%);
  box-shadow:
    0 22px 60px -18px oklch(0.05 0.02 260 / 85%),
    0 0 38px -14px color-mix(in oklch, var(--ca, var(--cyan)) 42%, transparent),
    inset 0 1px 0 color-mix(in oklch, var(--foreground) 16%, transparent);
  padding: 28px 32px; margin-bottom: 24px; min-height: 248px;
}
.bc-banner-beam {
  position: absolute; inset: 0; width: 38%;
  background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--ca, var(--cyan)) 16%, transparent), transparent);
  pointer-events: none; animation: bc-beam 7.5s ease-in-out infinite;
}
.bc-banner-aura {
  position: absolute; right: -48px; top: 50%; width: 310px; height: 310px;
  transform: translateY(-50%); border-radius: 999px; filter: blur(48px); pointer-events: none;
  background: radial-gradient(circle, color-mix(in oklch, var(--ca, var(--cyan)) 42%, transparent), transparent 70%);
  animation: bc-pulse-aura 3.6s ease-in-out infinite;
}
.bc-banner-grid { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: center; }
.bc-banner h1 { margin: 10px 0 8px; font: 700 clamp(26px, 3.6vw, 46px)/0.98 var(--font-display); color: var(--foreground); }
.bc-banner p { margin: 0; max-width: 600px; font-size: 14.5px; line-height: 1.55; color: var(--muted-foreground); }
.bc-banner-meta { margin-top: 10px; font: 600 11.5px/1.3 var(--font-mono); letter-spacing: .09em; color: color-mix(in oklch, var(--cyan) 90%, transparent); }
.bc-banner-act { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.bc-banner-char { width: 320px; height: 270px; margin-bottom: -28px; display: flex; align-items: flex-end; justify-content: center; }
.bc-banner-char img { max-height: 100%; max-width: 100%; object-fit: contain; object-position: bottom; filter: drop-shadow(0 12px 28px oklch(0.70 0.20 220 / 38%)); }
.bc-banner-emblem { width: 200px; height: 200px; display: grid; place-items: center; animation: bc-float 5.2s ease-in-out infinite; }
.bc-banner-emblem img {
  width: 100%; height: 100%; object-fit: contain;
  mix-blend-mode: screen;
  mask-image: radial-gradient(circle at center, black 44%, transparent 74%);
  -webkit-mask-image: radial-gradient(circle at center, black 44%, transparent 74%);
}

.bc-kicker {
  display: inline-flex; align-items: center; gap: 8px;
  font: 700 11px/1 var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan);
}
.bc-kicker::before {
  content: ""; width: 4px; height: 13px; border-radius: 999px;
  background: linear-gradient(180deg, var(--cyan), var(--primary)); box-shadow: 0 0 10px var(--cyan);
}
.bc-kicker.gold { color: var(--gold); }
.bc-kicker.gold::before { background: linear-gradient(180deg, var(--gold), oklch(0.75 0.19 65)); box-shadow: 0 0 10px var(--gold); }
.bc-kicker.valk { color: var(--valkyria); }
.bc-kicker.valk::before { background: linear-gradient(180deg, var(--valkyria), oklch(0.76 0.22 346)); box-shadow: 0 0 10px var(--valkyria); }
.bc-kicker.myth { color: var(--mythic); }
.bc-kicker.myth::before { background: linear-gradient(180deg, var(--mythic), var(--valkyria)); box-shadow: 0 0 10px var(--mythic); }

/* PANELS — EXACT PREVIEW OKLCH VALUES */
.bc-panel, .card {
  position: relative; border-radius: 1.25rem !important;
  border: 1px solid color-mix(in oklch, var(--border) 90%, transparent) !important;
  background: linear-gradient(
    165deg,
    color-mix(in oklch, var(--surface-elevated) 78%, transparent),
    color-mix(in oklch, var(--card) 92%, transparent)
  ) !important;
  backdrop-filter: blur(12px);
  box-shadow:
    0 12px 34px -16px oklch(0.05 0.02 260 / 80%),
    inset 0 1px 0 color-mix(in oklch, var(--foreground) 10%, transparent) !important;
  padding: 20px;
  transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
}
.bc-panel:hover {
  border-color: color-mix(in oklch, var(--cyan) 55%, transparent) !important;
  box-shadow:
    0 18px 42px -14px oklch(0.05 0.02 260 / 88%),
    0 0 26px -10px color-mix(in oklch, var(--primary) 45%, transparent),
    inset 0 1px 0 color-mix(in oklch, var(--cyan) 22%, transparent) !important;
}
.bc-panel-gold {
  border-color: color-mix(in oklch, var(--gold) 65%, transparent) !important;
  background:
    radial-gradient(95% 75% at 50% 0%, color-mix(in oklch, var(--gold) 22%, transparent), transparent 72%),
    linear-gradient(170deg, oklch(0.22 0.055 78 / 88%), oklch(0.155 0.042 258 / 96%)) !important;
  box-shadow:
    0 18px 44px -16px oklch(0.05 0.02 260 / 85%),
    0 0 34px -12px color-mix(in oklch, var(--gold) 45%, transparent),
    inset 0 1px 0 color-mix(in oklch, var(--gold) 40%, transparent) !important;
}
.bc-panel-gold:hover {
  border-color: var(--gold) !important;
  box-shadow:
    0 20px 50px -12px oklch(0.05 0.02 260 / 90%),
    0 0 42px -8px color-mix(in oklch, var(--gold) 58%, transparent) !important;
}
.bc-panel-valk {
  border-color: color-mix(in oklch, var(--valkyria) 78%, transparent) !important;
  background:
    radial-gradient(90% 85% at 92% 0%, color-mix(in oklch, var(--valkyria) 34%, transparent), transparent 68%),
    radial-gradient(65% 80% at 6% 100%, color-mix(in oklch, var(--valkyria) 22%, transparent), transparent 72%),
    linear-gradient(155deg, oklch(0.22 0.095 346 / 92%), oklch(0.145 0.048 278 / 96%)) !important;
  box-shadow:
    0 20px 50px -14px oklch(0.05 0.02 260 / 88%),
    0 0 44px -10px color-mix(in oklch, var(--valkyria) 58%, transparent),
    inset 0 1px 0 color-mix(in oklch, var(--valkyria) 55%, transparent) !important;
}
.bc-panel-valk:hover {
  border-color: var(--valkyria) !important;
  box-shadow:
    0 22px 54px -12px oklch(0.05 0.02 260 / 92%),
    0 0 52px -6px color-mix(in oklch, var(--valkyria) 72%, transparent) !important;
}
.bc-panel-mythic {
  border-color: color-mix(in oklch, var(--mythic) 76%, transparent) !important;
  background:
    radial-gradient(90% 75% at 50% 0%, color-mix(in oklch, var(--mythic) 30%, transparent), transparent 72%),
    linear-gradient(170deg, oklch(0.21 0.08 304 / 92%), oklch(0.15 0.045 262 / 96%)) !important;
  box-shadow:
    0 18px 46px -14px oklch(0.05 0.02 260 / 88%),
    0 0 38px -10px color-mix(in oklch, var(--mythic) 56%, transparent),
    inset 0 1px 0 color-mix(in oklch, var(--mythic) 50%, transparent) !important;
}
.bc-panel-mythic:hover {
  border-color: var(--mythic) !important;
  box-shadow:
    0 20px 52px -10px oklch(0.05 0.02 260 / 92%),
    0 0 46px -6px color-mix(in oklch, var(--mythic) 70%, transparent) !important;
}

/* Shimmer sweep on key highlights */
.bc-shimmer { position: relative; overflow: hidden; }
.bc-shimmer::after {
  content: ""; position: absolute; inset: 0; width: 34%;
  background: linear-gradient(105deg, transparent 0%, color-mix(in oklch, var(--foreground) 11%, transparent) 46%, color-mix(in oklch, var(--cyan) 20%, transparent) 52%, transparent 100%);
  pointer-events: none; transform: translateX(-160%) skewX(-22deg);
  animation: bc-beam 6.8s ease-in-out infinite;
}
.bc-panel-gold.bc-shimmer::after { background: linear-gradient(105deg, transparent 0%, color-mix(in oklch, var(--gold) 22%, transparent) 50%, transparent 100%); }
.bc-panel-valk.bc-shimmer::after { background: linear-gradient(105deg, transparent 0%, color-mix(in oklch, var(--valkyria) 28%, transparent) 50%, transparent 100%); }
.bc-panel-mythic.bc-shimmer::after { background: linear-gradient(105deg, transparent 0%, color-mix(in oklch, var(--mythic) 28%, transparent) 50%, transparent 100%); }

/* BUTTONS */
.bc-btn, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 16px; border-radius: 12px;
  border: 1px solid var(--border);
  background: color-mix(in oklch, var(--surface-elevated) 82%, transparent);
  color: var(--foreground);
  font: 700 11.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase;
  text-decoration: none; cursor: pointer; transition: .18s;
}
.bc-btn:hover, .btn:hover { border-color: color-mix(in oklch, var(--cyan) 62%, transparent); transform: translateY(-1px); }
.bc-btn.pri, .btn.pri {
  border-color: transparent;
  background: linear-gradient(135deg, var(--primary), oklch(0.66 0.22 232));
  color: var(--primary-foreground);
  box-shadow: 0 8px 24px -6px color-mix(in oklch, var(--primary) 72%, transparent), inset 0 1px 0 color-mix(in oklch, var(--foreground) 30%, transparent);
}
.bc-btn.pri:hover, .btn.pri:hover {
  filter: brightness(1.08);
  box-shadow: 0 12px 30px -4px color-mix(in oklch, var(--cyan) 55%, transparent), inset 0 1px 0 color-mix(in oklch, var(--foreground) 42%, transparent);
}
.bc-btn.gold {
  border-color: transparent;
  background: linear-gradient(135deg, oklch(0.78 0.18 80), var(--gold));
  color: var(--gold-foreground);
  box-shadow: 0 8px 26px -6px color-mix(in oklch, var(--gold) 65%, transparent);
}
.bc-btn.valk {
  border-color: transparent;
  background: linear-gradient(135deg, oklch(0.58 0.28 346), var(--valkyria));
  color: oklch(0.99 0.005 346);
  box-shadow: 0 8px 26px -6px color-mix(in oklch, var(--valkyria) 72%, transparent);
}
.bc-btn.cy {
  border-color: color-mix(in oklch, var(--cyan) 55%, transparent);
  background: color-mix(in oklch, var(--cyan) 14%, transparent);
  color: var(--cyan);
}
.bc-btn.bad {
  border-color: color-mix(in oklch, var(--crimson) 55%, transparent);
  background: color-mix(in oklch, var(--crimson) 15%, transparent);
  color: oklch(0.82 0.16 18);
}
.bc-btn.on {
  border-color: var(--cyan);
  background: color-mix(in oklch, var(--cyan) 20%, transparent);
  color: var(--cyan);
}

/* PILLS / BADGES */
.bc-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--border);
  background: color-mix(in oklch, var(--background) 78%, transparent);
  font: 700 10px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted-foreground); white-space: nowrap;
}
.bc-pill.gold { border-color: color-mix(in oklch, var(--gold) 60%, transparent); background: color-mix(in oklch, var(--gold) 16%, transparent); color: var(--gold); }
.bc-pill.cy { border-color: color-mix(in oklch, var(--cyan) 55%, transparent); background: color-mix(in oklch, var(--cyan) 15%, transparent); color: var(--cyan); }
.bc-pill.live { border-color: color-mix(in oklch, var(--live) 55%, transparent); background: color-mix(in oklch, var(--live) 16%, transparent); color: var(--live); }
.bc-pill.bad { border-color: color-mix(in oklch, var(--crimson) 60%, transparent); background: color-mix(in oklch, var(--crimson) 16%, transparent); color: oklch(0.84 0.15 18); }
.bc-pill.valk { border-color: color-mix(in oklch, var(--valkyria) 70%, transparent); background: color-mix(in oklch, var(--valkyria) 20%, transparent); color: oklch(0.88 0.14 346); }
.bc-pill.myth { border-color: color-mix(in oklch, var(--mythic) 70%, transparent); background: color-mix(in oklch, var(--mythic) 20%, transparent); color: oklch(0.88 0.15 304); }

/* GRIDS */
.bc-stack { display: flex; flex-direction: column; gap: 22px; }
.bc-g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.bc-g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.bc-g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.bc-g5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.bc-split { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; }

/* TABLET-LIKE SIDE-BY-SIDE MATCH ROW EVEN ON PHONE */
.bc-vs-row {
  display: grid !important; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) !important;
  align-items: center !important; gap: 12px !important;
  padding: 14px 16px; border-radius: 16px;
  border: 1px solid color-mix(in oklch, var(--border) 85%, transparent);
  background: color-mix(in oklch, var(--background) 76%, transparent);
}
.bc-vs-side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bc-vs-side.right { justify-content: flex-end; text-align: right; }
.bc-vs-logo {
  width: 44px; height: 44px; border-radius: 12px; flex: none;
  border: 1px solid color-mix(in oklch, var(--cyan) 42%, transparent);
  background: color-mix(in oklch, var(--card) 92%, transparent);
  display: grid; place-items: center; overflow: hidden; padding: 4px;
  font: 700 15px var(--font-display); color: var(--cyan);
}
.bc-vs-logo.fem { border-color: color-mix(in oklch, var(--valkyria) 70%, transparent); background: color-mix(in oklch, var(--valkyria) 14%, var(--background)); }
.bc-vs-logo img { width: 100%; height: 100%; object-fit: contain; }
.bc-vs-name { font: 700 17px/1.1 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bc-vs-sub { font: 600 10px/1.2 var(--font-mono); letter-spacing: .12em; color: var(--muted-foreground); text-transform: uppercase; margin-top: 2px; }
.bc-vs-mid {
  padding: 6px 12px; border-radius: 10px; text-align: center;
  border: 1px solid color-mix(in oklch, var(--cyan) 42%, transparent);
  background: color-mix(in oklch, var(--primary) 16%, var(--background));
  font: 700 17px/1 var(--font-display); color: var(--cyan); white-space: nowrap;
}

/* RANKING "DEMAIS POSIÇÕES" — CLEAN ON DESKTOP & FULL-WIDTH NAMES ON MOBILE */
.bc-rank-card {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px;
}
.bc-rank-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.bc-rank-pos { font: 700 22px/1 var(--font-display); color: var(--cyan); flex: none; }
.bc-rank-info { min-width: 0; flex: 1; }
.bc-rank-nick { font: 700 17px/1.15 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bc-rank-meta { font-size: 11.5px; color: var(--muted-foreground); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bc-rank-pts { text-align: right; flex: none; font: 700 19px/1 var(--font-display); white-space: nowrap; }
.bc-rank-pts small { font: 600 10px var(--font-mono); color: var(--muted-foreground); }

/* FICHAS CARDS — CLEAN SPACING & ZERO COLLISION */
.bc-fc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bc-fc-body { display: flex; align-items: center; gap: 11px; margin-top: 14px; min-width: 0; }
.bc-fc-av {
  width: 46px; height: 46px; flex: none; border-radius: 12px;
  border: 1px solid color-mix(in oklch, var(--cyan) 50%, transparent);
  background: color-mix(in oklch, var(--background) 85%, transparent);
  overflow: hidden; display: grid; place-items: center;
  font: 700 18px var(--font-display); color: var(--cyan);
}
.bc-fc-av.valk { border-color: var(--valkyria); color: var(--valkyria); }
.bc-fc-nick { font: 700 18px/1.15 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bc-fc-foot {
  margin-top: 14px; padding-top: 10px;
  border-top: 1px solid color-mix(in oklch, var(--border) 75%, transparent);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font: 600 10px var(--font-mono); color: var(--muted-foreground);
}
.bc-fc-foot span { white-space: nowrap; }

/* PIX & QR CODE — ZERO OVERLAP ON DESKTOP & MOBILE */
.bc-pix-layout {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 18px;
  align-items: center;
  margin-top: 14px;
}
#qr {
  background: #ffffff !important;
  padding: 10px !important;
  border-radius: 14px !important;
  width: 196px !important;
  height: 196px !important;
  min-width: 0 !important;
  min-height: 0 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  overflow: hidden !important;
  flex: none !important;
  line-height: 0 !important;
  box-shadow: 0 12px 28px -12px oklch(0.05 0.02 260 / 90%);
}
#qr img {
  width: 100% !important;
  height: 100% !important;
  max-width: 100% !important;
  max-height: 100% !important;
  display: block !important;
  object-fit: contain !important;
  image-rendering: pixelated !important;
}
.bc-pix-code {
  font: 11px/1.45 var(--font-mono);
  word-break: break-all;
  background: color-mix(in oklch, var(--background) 85%, transparent);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  max-height: 98px;
  overflow: auto;
  color: var(--cyan);
}

/* PUBLIC PLAYER PROFILE (#player/BC-XXX) — RESTORED & THEMED IN OKLCH */
.pf { display: flex; flex-direction: column; gap: 16px; }
.pf-top { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.pf-head { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 22px; }
.pf-head .plav .lav, .pf-head .plav .lav.pl {
  width: 96px; height: 96px; border-radius: 50%; overflow: hidden;
  border: 3px solid var(--cyan);
  background: color-mix(in oklch, var(--background) 85%, transparent);
  display: grid; place-items: center; font: 700 32px var(--font-display); color: var(--cyan);
  box-shadow: 0 0 32px color-mix(in oklch, var(--cyan) 42%, transparent);
}
.pf-head .plav .lav img { width: 100%; height: 100%; object-fit: cover; }
.pf-id h1 { margin: 6px 0 10px; font: 700 clamp(28px, 4.5vw, 40px)/1 var(--font-display); }
.pf-ch { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.plsp {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 999px;
  font: 700 12px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--c, var(--cyan)); border: 1px solid var(--c, var(--cyan));
  background: color-mix(in oklch, var(--c, var(--cyan)) 16%, transparent);
  box-shadow: 0 0 20px color-mix(in oklch, var(--c, var(--cyan)) 35%, transparent);
}
.pf-age {
  font: 700 11px/1 var(--font-mono); letter-spacing: .12em; color: var(--muted-foreground);
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
  background: color-mix(in oklch, var(--background) 78%, transparent);
}
.pf-st { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.pf-st > div {
  background: color-mix(in oklch, var(--background) 78%, transparent);
  border: 1px solid var(--border); border-radius: 14px; padding: 12px 10px; text-align: center;
}
.pf-st b { display: block; font: 700 26px/1.1 var(--font-display); color: var(--foreground); }
.pf-st .hi { border-color: color-mix(in oklch, var(--gold) 65%, transparent); background: color-mix(in oklch, var(--gold) 12%, var(--background)); }
.pf-st .hi b { color: var(--gold); font-size: 30px; }
.pf-st small { display: block; margin-top: 4px; font: 700 10px/1 var(--font-mono); letter-spacing: .16em; color: var(--muted-foreground); }
.pf-tabs {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
  border-bottom: 1px solid var(--border);
}
.pf-tabs button {
  background: transparent; border: 0; border-bottom: 3px solid transparent;
  color: var(--muted-foreground); font: 700 12px/1 var(--font-mono); letter-spacing: .14em;
  padding: 12px 16px; cursor: pointer; white-space: nowrap; transition: .18s;
}
.pf-tabs button:hover { color: var(--foreground); }
.pf-tabs button.on { color: var(--cyan); border-bottom-color: var(--cyan); }
.pf-pane { display: none; }
.pf-pane.on { display: block; animation: bc-enter .22s ease both; }
.lbl {
  font: 700 11px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted-foreground); margin-bottom: 10px;
}
.spcs, .ttls { display: flex; flex-wrap: wrap; gap: 10px; }
.spc {
  min-width: 155px; padding: 13px 16px; border-radius: 14px;
  border: 1px solid color-mix(in oklch, var(--c, var(--cyan)) 42%, transparent);
  background: color-mix(in oklch, var(--c, var(--cyan)) 10%, var(--background));
}
.spc b { display: block; font: 700 18px/1.1 var(--font-display); color: var(--c, var(--cyan)); }
.spc small { display: block; margin-top: 4px; font: 700 10px/1.2 var(--font-mono); letter-spacing: .12em; color: var(--muted-foreground); }
.spc.on {
  box-shadow: 0 0 26px color-mix(in oklch, var(--c, var(--cyan)) 45%, transparent);
  background: color-mix(in oklch, var(--c, var(--cyan)) 18%, var(--background));
  border-color: var(--c, var(--cyan));
}
.spc.lock { opacity: .48; filter: grayscale(.6); border-style: dashed; }
.ttl {
  padding: 12px 16px; border-radius: 14px;
  border: 1px solid var(--border);
  background: color-mix(in oklch, var(--card) 85%, transparent);
}
.ttl b { display: block; font: 700 16px/1.2 var(--font-display); }
.ttl small { display: block; margin-top: 3px; color: var(--muted-foreground); font-size: 12px; }
.ttl.k-pontos { border-color: color-mix(in oklch, var(--gold) 65%, transparent); background: linear-gradient(135deg, color-mix(in oklch, var(--gold) 18%, transparent), transparent); }
.ttl.k-pontos b { color: var(--gold); }
.ttl.k-campeonato { border-color: var(--cyan); background: linear-gradient(135deg, color-mix(in oklch, var(--cyan) 18%, transparent), transparent); }
.ttl.k-premio { border-color: color-mix(in oklch, var(--live) 60%, transparent); background: color-mix(in oklch, var(--live) 12%, transparent); }
.ttl.k-ficha { border-color: color-mix(in oklch, var(--mythic) 60%, transparent); background: color-mix(in oklch, var(--mythic) 12%, transparent); }
.ttl.k-ficha.emuso { border-color: var(--live); box-shadow: 0 0 18px color-mix(in oklch, var(--live) 30%, transparent); }
.ttl.k-ficha.emuso small { color: var(--live); }

/* ADAPTIVE FULLSCREEN BRACKET MODAL */
#bc-brmod {
  position: fixed; inset: 0; z-index: 95; display: none;
  background: oklch(0.10 0.03 258 / 92%); backdrop-filter: blur(12px);
  padding: 14px; align-items: center; justify-content: center;
}
#bc-brmod.open { display: flex; animation: bc-enter .2s ease both; }
.bc-brmod-box {
  width: 100%; max-width: 1260px; max-height: 92vh;
  display: flex; flex-direction: column; overflow: hidden;
  border-radius: 22px; border: 1px solid color-mix(in oklch, var(--cyan) 48%, transparent);
  background: var(--background);
  box-shadow: 0 30px 90px oklch(0.04 0.02 260 / 95%);
}
.bc-brmod-hd {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  background: color-mix(in oklch, var(--card) 92%, transparent);
}
.bc-brmod-body { flex: 1; overflow: auto; padding: 18px; }
.bc-br-grid { display: flex; gap: 16px; align-items: stretch; min-width: max-content; }
.bc-br-col { width: 235px; display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }
.bc-br-match {
  border-radius: 14px; border: 1px solid var(--border);
  background: color-mix(in oklch, var(--card) 92%, transparent); overflow: hidden;
}
.bc-br-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 11px; font-size: 13px; font-weight: 600;
}
.bc-br-row.win { background: color-mix(in oklch, var(--live) 16%, transparent); color: var(--live); }
.bc-br-row.lose { opacity: .48; }
.bc-br-row.bc b { color: var(--gold); }
.bc-br-row.fem b { color: var(--valkyria); }

/* RING */
.bc-ring {
  width: 96px; height: 96px; border-radius: 50%; margin: 12px auto 0;
  background: conic-gradient(var(--rc, var(--cyan)) calc(var(--v, 0) * 1%), color-mix(in oklch, var(--surface-elevated) 75%, transparent) 0);
  display: grid; place-items: center;
}
.bc-ring > div {
  width: 74px; height: 74px; border-radius: 50%; background: var(--background);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}

/* COUNTDOWN TILES */
.bc-cd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.bc-cd > div {
  border-radius: 12px; border: 1px solid color-mix(in oklch, var(--cyan) 32%, transparent);
  background: color-mix(in oklch, var(--background) 80%, transparent); padding: 10px 6px; text-align: center;
}
.bc-cd b { display: block; font: 700 22px/1 var(--font-display); color: var(--cyan); }
.bc-cd small { display: block; font: 700 9px/1 var(--font-mono); color: var(--muted-foreground); margin-top: 4px; letter-spacing: .14em; }

/* CLIPS SQUARE PREVIEW */
.bc-clip-thumb {
  position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border); background: oklch(0.08 0.02 258); cursor: pointer;
}
.bc-clip-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
.bc-clip-thumb:hover img { transform: scale(1.04); }
.bc-clip-play {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: linear-gradient(180deg, transparent, oklch(0.06 0.02 258 / 65%));
}
.bc-clip-play span {
  width: 50px; height: 50px; border-radius: 50%;
  background: color-mix(in oklch, var(--cyan) 92%, transparent);
  color: var(--cyan-foreground); display: grid; place-items: center;
  font-size: 18px; padding-left: 3px;
  box-shadow: 0 0 28px color-mix(in oklch, var(--cyan) 65%, transparent);
}

/* INPUTS & MODALS */
input, select, textarea {
  background: color-mix(in oklch, var(--background) 85%, transparent) !important;
  border: 1px solid var(--input) !important;
  color: var(--foreground) !important; border-radius: 12px !important; padding: 10px 13px !important;
  font-family: var(--font-sans) !important;
}
input:focus, select:focus, textarea:focus {
  outline: none !important; border-color: var(--cyan) !important;
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--cyan) 18%, transparent);
}
#m .box, .md .box {
  background: var(--sidebar) !important;
  border: 1px solid color-mix(in oklch, var(--cyan) 42%, transparent) !important;
  border-radius: 20px !important;
}

/* REDUCED EFFECTS MODE */
html[data-reduce-fx="1"] .bc-banner-beam,
html[data-reduce-fx="1"] .bc-shimmer::after { display: none !important; animation: none !important; }
html[data-reduce-fx="1"] .bc-banner-emblem,
html[data-reduce-fx="1"] .bc-banner-aura,
html[data-reduce-fx="1"] .bc-view { animation: none !important; }
html[data-reduce-fx="1"] *, html[data-reduce-fx="1"] *::before, html[data-reduce-fx="1"] *::after { transition-duration: 0.01ms !important; }

/* ===== RESPONSIVE — TABLET-CLOSE MOBILE EXPERIENCE ===== */
@media (max-width: 1024px) {
  #nav { width: 280px !important; transform: translateX(-104%); }
  html.bc-mob-open #nav { transform: translateX(0); }
  .bc-sb-toggle { display: none !important; }
  .bc-sb-close { display: grid !important; }
  #tb { margin-left: 0 !important; padding: 10px 14px !important; }
  main { margin-left: 0 !important; padding: 14px 14px 44px !important; }
  .bc-menu-btn, .bc-tb-mobbrand { display: inline-flex !important; }
  .bc-tb-crumb { display: none !important; }
  .bc-g5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .bc-g4 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .bc-split { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .bc-banner { padding: 18px 16px; min-height: 0; }
  .bc-banner-grid { grid-template-columns: 1fr; gap: 14px; }
  .bc-banner-char { width: 220px; height: 190px; margin: 0 auto -18px; }
  .bc-banner-emblem { width: 132px; height: 132px; margin: 0 auto; }
  .bc-g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bc-g3 { grid-template-columns: 1fr; gap: 12px; }
  .bc-g3.bc-g3-mob2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bc-g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

  const BR_STATE = {};
  function renderBracketMatch(t, m, isFinal){
    const row = (q, sc, win, lose, topBorder)=>{
      const isBc = q && !q.bye && BCRE.test(q.n);
      const isFem = q && !!q.fm;
      return `<div class="bc-br-row${win?' win':''}${lose?' lose':''}${isBc?' bc':''}${isFem?' fem':''}" ${topBorder?'style="border-top:1px solid rgba(76,125,255,.2)"':''}>
        <b>${!q?'A DEFINIR':q.bye?'BYE (Avanço direto)':(isFem?'<span style="color:var(--valk)">VALK </span>':'')+esc(q.n)}</b>
        <em>${sc!=null?sc:(m.bye?'—':'·')}</em>
      </div>`;
    };
    return `<div class="bc-br-match${isFinal?' fin':''}${m.bye?' bye':''}" data-xm="${t.id}:${m.r}:${m.i}">
      ${row(m.A, m.a, m.w===0, m.w===1, false)}
      ${row(m.B, m.b, m.w===1, m.w===0, true)}
    </div>`;
  }

/* ===== PIX: doação e compra na loja (funções criar-pix / webhook-mp no Supabase) ===== */
let _pixTimer = null;
async function bcPixStart(body, titulo){
  if(!me){ toast('Entre com o Discord para continuar.'); login(); return; }
  toast('Gerando seu Pix…');
  let j = {}, ok = false, statusHttp = 0;
  try{
    const r = await fetch(U+'/functions/v1/criar-pix',{method:'POST',headers:{'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+(S&&S.a)},body:JSON.stringify(body)});
    statusHttp = r.status; j = await r.json().catch(()=>({})); ok = r.ok && j.pedido;
  }catch(e){}
  if(!ok){ toast((statusHttp>=400 && statusHttp<500 && j.erro) ? j.erro : 'Não foi possível gerar o Pix agora. Tente novamente em instantes.'); return; }
  const fim = Date.now() + 15*60*1000;
  modal(`<span class="bc-kicker gold">PAGAMENTO VIA PIX</span><h2 style="margin:8px 0">${esc(titulo)}</h2>
    <p class="so" style="margin:0">Abra o app do seu banco, escolha Pix e leia o QR Code ou use o copia e cola. Este código é só seu e vale por 15 minutos.</p>
    <img class="bc-pix-qr" alt="QR Code Pix" src="data:image/png;base64,${j.qr_base64}">
    <input class="bc-pix-code" id="bc-pix-code" readonly value="${esc(j.copia_e_cola)}">
    <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="bc-btn pri" id="bc-pix-copy">Copiar código</button><button class="bc-btn" onclick="closeM()">Fechar</button></div>
    <div id="bc-pix-st" class="so" style="margin-top:12px;font-weight:700">Aguardando pagamento…</div>`);
  $('#bc-pix-copy').onclick = ()=>navigator.clipboard.writeText(j.copia_e_cola).then(()=>toast('Código copiado!')).catch(()=>{$('#bc-pix-code').select();toast('Selecione e copie.')});
  clearInterval(_pixTimer);
  _pixTimer = setInterval(async()=>{
    const box = $('#bc-pix-st');
    if(!box || !$('#mod').classList.contains('on')){ clearInterval(_pixTimer); return; }
    if(Date.now() > fim){ box.textContent = 'Este Pix expirou. Feche e gere outro.'; clearInterval(_pixTimer); return; }
    const r = await api('/rest/v1/pedidos?select=status&id=eq.'+j.pedido);
    const st = r.ok && arr(r.d)[0] && arr(r.d)[0].status;
    if(st==='pago'){
      clearInterval(_pixTimer);
      const nome = esc((me&&me.display_name)||'');
      box.innerHTML = body.tipo==='loja'
        ? `<span style="color:var(--ok)">✔ Compra confirmada, ${nome}! Sua ficha será liberada no seu perfil em instantes.</span>`
        : `<span style="color:var(--ok)">✔ Pagamento confirmado! Obrigado pelo apoio, ${nome}. Você já entra no TOP de apoiadores.</span>`;
      toast('Pagamento confirmado! 💙');
      setTimeout(()=>{ if(tab==='socials'||tab==='donate'||tab==='loja') show(); }, 4000);
    }
  }, 3000);
}
