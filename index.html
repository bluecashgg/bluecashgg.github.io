async function drawFicha(p){const pink=p.theme==='Valkyria',c=document.createElement('canvas');c.width=c.height=1254;const x=c.getContext('2d'),ld=s=>new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});

const tx=pink?'#FFE9F3':'#EAF2FF',nm=pink?'#FA3B85':'#FFFFFF',bo=pink?'#C23368':'#2F5FD8',l1=pink?'#FF8FC2':'#7CFFB2',l2=pink?'#F70363':'#22C55E';
x.textBaseline='middle';x.fillStyle=tx;x.font='700 30px Rajdhani,Segoe UI,sans-serif';x.fillText(p.nick||'—',285,324);x.fillText(p.age?String(p.age):'—',285,405);x.fillText(p.status||'—',285,488);

const DX=[477.5,594.5,713,834,955];[[816,p.speed],[900.5,p.sensi],[985.5,p.movement],[1070,p.positioning],[1156,p.defense]].forEach(([y,n])=>DX.forEach((px,i)=>{x.beginPath();x.arc(px,y,15.5,0,7);if(i<n){const g=x.createRadialGradient(px,y,0,px,y,15.5);g.addColorStop(0,l1);g.addColorStop(1,l2);x.fillStyle=g;x.fill()}else{x.lineWidth=3;x.strokeStyle=bo;x.stroke()}}));return c}

function cpfOk(s){const d=[...s].map(Number);if(d.length!==11||new Set(d).size===1)return false;for(const n of[9,10]){let t=0;for(let i=0;i<n;i++)t+=d[i]*(n+1-i);if((t*10)%11%10!==d[n])return false}return true}
function pixKey(v){const k=String(v.pix_key||'').trim(),t=v.pix_type||'',dg=k.replace(/\D/g,''),isNum=/^[\d\s().+/-]+$/.test(k);
if(t==='phone')return'+55'+dg.replace(/^55(?=\d{11}$)/,'');if(t==='cpf'||t==='cnpj')return dg;if(t==='email'||t==='random')return k;
if(!isNum)return k;if(dg.length===14)return dg;if(dg.length===11)return cpfOk(dg)?dg:'+55'+dg;if(dg.length===13&&dg.startsWith('55'))return'+'+dg;return k}
